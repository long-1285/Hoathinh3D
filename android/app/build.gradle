plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def loadSharedSigningProps = {
    def props = new Properties()
    def envPath = System.getenv("HH3D_KEYSTORE_PATH")
    if (envPath && new File(envPath).exists()) {
        props.setProperty("storeFile", envPath)
        props.setProperty("storePassword", System.getenv("HH3D_KEYSTORE_PASS") ?: "")
        props.setProperty("keyAlias", System.getenv("HH3D_KEY_ALIAS") ?: "hoathinh3d_shared")
        props.setProperty("keyPassword", System.getenv("HH3D_KEY_PASS") ?: (System.getenv("HH3D_KEYSTORE_PASS") ?: ""))
        return props
    }
    def candidates = [
        file("${rootProject.projectDir}/keystore.properties"),
        file("${rootProject.projectDir}/../keystore.properties"),
        file("${System.getProperty('user.home')}/.hoathinh3d/keystore.properties"),
        file("${rootProject.projectDir}/signing/keystore.properties")
    ]
    for (File f : candidates) {
        if (f.exists()) {
            f.withInputStream { props.load(it) }
            return props
        }
    }
    return null
}

def sharedSigningProps = loadSharedSigningProps()
def sharedSigningStoreFile = null
if (sharedSigningProps != null) {
    def rawStore = sharedSigningProps.getProperty("storeFile", "").trim()
    if (rawStore) {
        def candidate = new File(rawStore)
        if (!candidate.exists()) {
            candidate = new File("${System.getProperty('user.home')}/.hoathinh3d/${candidate.name}")
        }
        if (candidate.exists()) {
            sharedSigningStoreFile = candidate
        }
    }
}

android {
    namespace "com.hoathinh3d.donghua"
    compileSdk rootProject.ext.compileSdkVersion

    if (sharedSigningStoreFile != null) {
        signingConfigs {
            sharedDebug {
                storeFile sharedSigningStoreFile
                storePassword sharedSigningProps.getProperty("storePassword", "")
                keyAlias sharedSigningProps.getProperty("keyAlias", "hoathinh3d_shared")
                keyPassword sharedSigningProps.getProperty("keyPassword", sharedSigningProps.getProperty("storePassword", ""))
            }
        }
    }

    defaultConfig {
        applicationId "com.hoathinh3d.donghua"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 53
        versionName "3.6.3-v53"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        resourceConfigurations += ["vi", "en"]
        resValue "string", "app_name", "HoatHinh3D v${versionName}"
        resValue "string", "title_activity_main", "HoatHinh3D v${versionName}"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        debug {
            if (signingConfigs.findByName("sharedDebug") != null) {
                signingConfig signingConfigs.sharedDebug
            }
        }
        release {
            if (signingConfigs.findByName("sharedDebug") != null) {
                signingConfig signingConfigs.sharedDebug
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.2.0"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.fragment:fragment-ktx:1.8.5"
    implementation "androidx.activity:activity-ktx:1.9.3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"

    // Media3 ExoPlayer (HLS + OkHttp DataSource + Cache)
    def media3Version = "1.5.1"
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-datasource-okhttp:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    implementation "androidx.media3:media3-common:$media3Version"

    // Networking, HTML scraping & Images
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.jsoup:jsoup:1.18.3"
    implementation "com.github.bumptech.glide:glide:4.16.0"

    // Testing
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0"
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
